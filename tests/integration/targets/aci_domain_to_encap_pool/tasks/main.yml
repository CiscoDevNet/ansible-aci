- name: Test that we have an ACI APIC host, ACI username and ACI password
  ansible.builtin.fail:
    msg: 'Please define the following variables: aci_hostname, aci_username and aci_password.'
  when: aci_hostname is not defined or aci_username is not defined or aci_password is not defined

- name: Test physical domain to encap pool bindings
  ansible.builtin.include_tasks: physical.yml

- name: Test FC domain to VSAN pool bindings
  ansible.builtin.include_tasks: fc_domain.yml

- name: Test L2 domain to VLAN pool bindings
  ansible.builtin.include_tasks: l2_domain.yml

- name: Test L3 domain to VLAN pool bindings
  ansible.builtin.include_tasks: l3_domain.yml

- name: Test VMM domain to VLAN pool bindings
  ansible.builtin.include_tasks: vmm_domain.yml

# ERROR HANDLING
- name: Set ACI error handling test connection details
  ansible.builtin.set_fact:
    aci_error_info: &aci_error_info
      host: "{{ aci_hostname }}"
      username: "{{ aci_username }}"
      password: "{{ aci_password }}"
      validate_certs: "{{ aci_validate_certs | default(false) }}"
      use_ssl: "{{ aci_use_ssl | default(true) }}"
      use_proxy: "{{ aci_use_proxy | default(true) }}"
      output_level: "{{ aci_output_level | default('info') }}"

- name: Reject a specific-domain query without domain_type
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    pool_type: vlan
    state: query
  ignore_errors: true
  register: error_domain_type_required

- name: Reject a specific VMM query without vm_provider
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    domain_type: vmm
    pool_type: vlan
    state: query
  ignore_errors: true
  register: error_vmm_query_vm_provider_required

- name: Reject a VMM state change without vm_provider
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    domain_type: vmm
    pool: error_handling_pool
    pool_type: vlan
    pool_allocation_mode: static
    state: present
  ignore_errors: true
  register: error_vmm_state_change_vm_provider_required

- name: Reject vm_provider on physical domain binding
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    domain_type: phys
    vm_provider: vmware
    pool: error_handling_pool
    pool_type: vlan
    pool_allocation_mode: static
    state: present
  ignore_errors: true
  register: error_physical_vm_provider

- name: Reject VLAN binding without allocation mode
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    domain_type: phys
    pool: error_handling_pool
    pool_type: vlan
    state: present
  ignore_errors: true
  register: error_vlan_allocation_mode_required

- name: Reject allocation mode on VXLAN binding
  cisco.aci.aci_domain_to_encap_pool:
    <<: *aci_error_info
    domain: error_handling_test
    domain_type: phys
    pool: error_handling_pool
    pool_type: vxlan
    pool_allocation_mode: dynamic
    state: present
  ignore_errors: true
  register: error_vxlan_allocation_mode

- name: Assert ACI domain to encap pool error handling results
  ansible.builtin.assert:
    that:
      - error_domain_type_required is failed
      - "'domain_type' in error_domain_type_required.msg"
      - error_vmm_query_vm_provider_required is failed
      - error_vmm_query_vm_provider_required.msg == "'vm_provider' is required for a VMM domain type"
      - error_vmm_state_change_vm_provider_required is failed
      - error_vmm_state_change_vm_provider_required.msg == "'vm_provider' is required for a VMM domain type"
      - error_physical_vm_provider is failed
      - error_physical_vm_provider.msg == "Domain type 'phys' cannot have a 'vm_provider'"
      - error_vlan_allocation_mode_required is failed
      - error_vlan_allocation_mode_required.msg == "ACI requires the 'pool_allocation_mode' for 'pool_type' of 'vlan' and 'vsan' when 'pool' is provided"
      - error_vxlan_allocation_mode is failed
      - error_vxlan_allocation_mode.msg == "vxlan pools do not support setting the allocation_mode; please remove this parameter from the task"
